<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Master Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glassmorphism.css}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-3 col-lg-2 d-md-block glass-sidebar p-3">
            <div class="d-flex align-items-center mb-4 px-2">
                <i class="bi bi-boxes fs-3 text-info me-2"></i>
                <h4 class="fw-bold mb-0 text-white tracking-wide">StockMaster</h4>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-grid-1x2 me-2"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"><i class="bi bi-box-seam me-2"></i> Products (Stock)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/purchases/create}"><i class="bi bi-arrow-down-left-square me-2"></i> Stock In (Purchase)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/sales/create}"><i class="bi bi-arrow-up-right-square me-2"></i> Stock Out (Sales)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/stock-adjustments/create}"><i class="bi bi-sliders me-2"></i> Stock Adjustment</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categories}"><i class="bi bi-tags me-2"></i> Categories</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/suppliers}"><i class="bi bi-truck me-2"></i> Suppliers</a>
                </li>
                <!-- Chatbot Navigation Link -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chatbot}"><i class="bi bi-robot me-2"></i> StockBot Assistant</a>
                </li>
            </ul>

            <hr class="border-secondary my-4">
            <div class="px-2">
                <small class="text-secondary d-block">Logged in as:</small>
                <div class="fw-bold text-light" sec:authentication="name">User</div>
                <form th:action="@{/logout}" method="post" class="mt-3">
                    <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-3">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </button>
                </form>
            </div>
        </nav>

        <!-- Main Content Host -->
        <main class="col-md-9 ms-sm-auto col-lg-10 p-4">
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
