<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | StockMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glassmorphism.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="col-md-5">
        <div class="card glass-card p-4">
            <h3 class="fw-bold text-white mb-2">Register User</h3>
            <p class="text-secondary mb-4">Set up a new inventory operations user</p>

            <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control form-control-glass" required />
                    <div class="text-danger small" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Username</label>
                    <input type="text" th:field="*{username}" class="form-control form-control-glass" required />
                    <div class="text-danger small" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control form-control-glass" required />
                    <div class="text-danger small" th:errors="*{email}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" th:field="*{password}" class="form-control form-control-glass" required />
                    <div class="text-danger small" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary-glass w-100 mb-3">Create User Account</button>
                <div class="text-center">
                    <a th:href="@{/login}" class="text-info text-decoration-none small">Already have credentials? Sign in</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
