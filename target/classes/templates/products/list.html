<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout/base :: layout(~{::content})}">
<head><title>Inventory Catalog</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-white mb-0">Stock Master Catalog</h2>
            <p class="text-secondary mb-0">Manage items, pricing thresholds, and master levels</p>
        </div>
        <a th:href="@{/products/create}" class="btn btn-primary-glass">
            <i class="bi bi-plus-circle me-1"></i> Register New SKU
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>
    <!-- Live Search Filter -->
    <div class="card glass-card p-3 mb-4">
        <form th:action="@{/products}" method="get" class="row g-2">
            <div class="col-md-10">
                <input type="text" name="search" th:value="${search}" class="form-control form-control-glass" placeholder="Search by SKU code or product title..." />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-info w-100 rounded-3">Search</button>
            </div>
        </form>
    </div>

    <!-- Product Grid Table -->
    <div class="card glass-card p-4">
        <div class="table-responsive">
            <table class="table table-glass align-middle">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Cost</th>
                        <th>Price</th>
                        <th>In Stock</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td class="fw-bold text-info" th:text="${product.sku}">SKU-001</td>
                        <td class="text-white" th:text="${product.name}">Example Item</td>
                        <td th:text="${product.category != null ? product.category.name : '-'}">Category</td>
                        <td th:text="'₹' + ${product.costPrice}">₹0.00</td>
                        <td th:text="'₹' + ${product.sellingPrice}">₹0.00</td>
                        <td class="fw-bold" th:text="${product.quantityInStock + ' ' + (product.unit != null ? product.unit : '')}">0</td>
                        <td>
                            <span th:if="${product.quantityInStock <= product.reorderLevel}" class="badge bg-danger">Low Stock</span>
                            <span th:unless="${product.quantityInStock <= product.reorderLevel}" class="badge bg-success">Optimal</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/products/delete/{id}(id=${product.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to remove this item?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="8" class="text-center text-secondary py-4">No inventory products registered.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
