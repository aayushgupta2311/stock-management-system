<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<head><title>Dispatch Stock</title></head>
<body>
<div th:fragment="content">
    <div class="col-lg-6 mx-auto">
        <div class="card glass-card p-4">
            <h3 class="fw-bold text-white mb-2"><i class="bi bi-bag-check me-2 text-success"></i>Stock Out / Sales</h3>
            <p class="text-secondary mb-4">Deducts quantity and registers point-of-sale receipt</p>

            <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

            <form th:action="@{/sales/save}" th:object="${saleOrder}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary">Customer Reference / Name</label>
                    <input type="text" th:field="*{customerName}" class="form-control form-control-glass" placeholder="Walk-in Client or Company" required />
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Product to Dispatch</label>
                    <select th:field="*{product.id}" class="form-select form-select-glass" required>
                        <option value="">-- Select SKU --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (Available: ' + p.quantityInStock + ')'}"></option>
                    </select>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-secondary">Quantity</label>
                        <input type="number" th:field="*{quantity}" min="1" class="form-control form-control-glass" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary">Unit Sale Price (₹)</label>
                        <input type="number" step="0.01" th:field="*{unitPrice}" class="form-control form-control-glass" required />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-glass w-100">Process Sale &amp; Decrement Stock</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
