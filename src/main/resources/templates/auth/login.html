<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | StockMaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/glassmorphism.css}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="col-md-4">
        <div class="card glass-card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-boxes fs-1 text-info"></i>
                <h3 class="fw-bold text-white mt-2">Sign In</h3>
                <p class="text-secondary">Stock &amp; Inventory Management System</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                You have been safely signed out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success py-2">
                Account registered! Please login now.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary">Username</label>
                    <input type="text" name="username" class="form-control form-control-glass" required autofocus />
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" name="password" class="form-control form-control-glass" required />
                </div>
                <button type="submit" class="btn btn-primary-glass w-100">Authenticate</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-secondary">Default Admin: <code>admin</code> / <code>admin123</code></small>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/register}" class="text-info text-decoration-none small">Create a New Manager Account</a>
            </div>
        </div>
    </div>
</body>
</html>
