<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<head><title>Stock Inward Form</title></head>
<body>
<div th:fragment="content">
    <div class="col-lg-6 mx-auto">
        <div class="card glass-card p-4">
            <h3 class="fw-bold text-white mb-2"><i class="bi bi-box-arrow-in-down me-2 text-info"></i>Receive Inward Stock</h3>
            <p class="text-secondary mb-4">Stock will be automatically credited to item inventory</p>

            <div th:if="${errorMessage}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>
            <form th:action="@{/purchases/save}" th:object="${purchaseOrder}" method="post">
                <div class="mb-3">
                    <label class="form-label text-secondary">Target Product</label>
                    <select th:field="*{product.id}" class="form-select form-select-glass" required>
                        <option value="">-- Choose Product --</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.sku + ' - ' + p.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary">Quantity Received</label>
                    <input type="number" th:field="*{quantity}" class="form-control form-control-glass" min="1" required />
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary">Effective Unit Cost ($)</label>
                    <input type="number" step="0.01" th:field="*{unitPrice}" class="form-control form-control-glass" required />
                </div>

                <button type="submit" class="btn btn-primary-glass w-100">Commit Stock Inward</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
